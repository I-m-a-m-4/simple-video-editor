name: Build Desktop (Windows MSI/NSIS) & Android (APK/AAB) & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-windows:
    name: Build Windows MSI & NSIS via Tauri
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Setup Node.js (for Tauri CLI & tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust dependencies & build WASM
        run: |
          wasm-pack build rust/wasm --target bundler --out-dir pkg

      - name: Install Root & Web Dependencies
        run: |
          bun install

      - name: Build Web Application (Static Export for Tauri)
        env:
          NEXT_PUBLIC_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          TAURI_EXPORT: "true"
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_MARBLE_API_URL: "https://api.marblecms.com"
          DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
          BETTER_AUTH_SECRET: "ci_build_secret_key_32_characters_minimum"
          UPSTASH_REDIS_REST_URL: "http://localhost:8079"
          UPSTASH_REDIS_REST_TOKEN: "example_token"
          MARBLE_WORKSPACE_KEY: "dummy_key"
          FREESOUND_CLIENT_ID: "dummy_id"
          FREESOUND_API_KEY: "dummy_key"
        run: |
          bun run build:web

      - name: Build Tauri Desktop (MSI & NSIS Bundles)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_EXPORT: "true"
          NODE_ENV: production
          NEXT_PUBLIC_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_MARBLE_API_URL: "https://api.marblecms.com"
          DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
          BETTER_AUTH_SECRET: "ci_build_secret_key_32_characters_minimum"
          UPSTASH_REDIS_REST_URL: "http://localhost:8079"
          UPSTASH_REDIS_REST_TOKEN: "example_token"
          MARBLE_WORKSPACE_KEY: "dummy_key"
          FREESOUND_CLIENT_ID: "dummy_id"
          FREESOUND_API_KEY: "dummy_key"
        run: |
          npx @tauri-apps/cli build --bundles msi,nsis --no-before-build-command

      - name: Upload Windows MSI & Setup Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambercut-windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            **/bundle/msi/*.msi
            **/bundle/nsis/*.exe
          if-no-files-found: warn

  build-tauri-android:
    name: Build Android APK & AAB via Tauri
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Set Android environment variables
        run: |
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install Rust dependencies & build WASM
        run: |
          wasm-pack build rust/wasm --target bundler --out-dir pkg

      - name: Install Root & Web Dependencies
        run: |
          bun install

      - name: Build Web Application (Static Export for Tauri)
        env:
          NEXT_PUBLIC_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          TAURI_EXPORT: "true"
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_MARBLE_API_URL: "https://api.marblecms.com"
          DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
          BETTER_AUTH_SECRET: "ci_build_secret_key_32_characters_minimum"
          UPSTASH_REDIS_REST_URL: "http://localhost:8079"
          UPSTASH_REDIS_REST_TOKEN: "example_token"
          MARBLE_WORKSPACE_KEY: "dummy_key"
          FREESOUND_CLIENT_ID: "dummy_id"
          FREESOUND_API_KEY: "dummy_key"
        run: |
          bun run build:web

      - name: Initialize Android Project
        run: |
          npx @tauri-apps/cli android init --ci --skip-targets-install

      - name: Make gradlew executable
        run: |
          chmod +x src-tauri/gen/android/gradlew || true

      - name: Build Android APK and AAB
        env:
          TAURI_EXPORT: "true"
          NODE_ENV: production
          NEXT_PUBLIC_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_MARBLE_API_URL: "https://api.marblecms.com"
          DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
          BETTER_AUTH_SECRET: "ci_build_secret_key_32_characters_minimum"
          UPSTASH_REDIS_REST_URL: "http://localhost:8079"
          UPSTASH_REDIS_REST_TOKEN: "example_token"
          MARBLE_WORKSPACE_KEY: "dummy_key"
          FREESOUND_CLIENT_ID: "dummy_id"
          FREESOUND_API_KEY: "dummy_key"
        run: |
          npx @tauri-apps/cli android build --apk --aab --ci

      - name: Upload Android Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambercut-android-builds
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  publish-release:
    name: Publish to GitHub Releases & Tags
    needs: [build-tauri-windows, build-tauri-android]
    if: always() && needs.build-tauri-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ambercut-windows-installers
          path: release-dist/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ambercut-android-builds
          path: release-dist/android

      - name: Collect Release Assets
        run: |
          mkdir -p release-assets
          find release-dist -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.apk" -o -name "*.aab" \) -exec cp -v {} release-assets/ \;
          echo "Collected files for release:"
          ls -la release-assets/

      - name: Determine Tag and Release Name
        id: tag_info
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=AmberCut ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "TAG_NAME=v${VERSION}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=AmberCut v${VERSION} (Build #${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          body: |
            ## AmberCut Desktop Release
            Automated build with Groq AI Agentic Copilot and Launch Video Studio.

            ### Downloads & Installers
            - **Windows MSI**: `.msi` Windows Installer package
            - **Windows EXE**: `.exe` NSIS Setup installer
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
