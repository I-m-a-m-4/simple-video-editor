[package]
name = "opencut-desktop-tauri"
version = "0.1.0"
description = "OpenCut - AI-Powered Video Editor"
authors = ["OpenCut Team"]
license = "MIT"
edition = "2021"

[lib]
name = "opencut_desktop_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
